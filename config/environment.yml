name: chemo_extractor_env  # 1. 为新环境命名，避免与旧环境冲突

channels:
  - conda-forge         # 2. 将conda-forge作为主渠道，保证包的兼容性
  - defaults

dependencies:
  # 核心依赖
  - python=3.9          # 3. 锁定与ChemDataExtractor兼容的Python版本
  - pip
  
  # ChemDataExtractor及其依赖 (从conda-forge安装，避免编译)
  - chemdataextractor   # 4. 直接从conda-forge安装，它会自动处理DAWG等所有依赖
  
  # 图像处理库
  - pillow              # 用于我们的裁剪脚本
  
  # 可选：其他您可能需要的常用工具
  - jupyter             # 如果您想在notebook中测试
  - matplotlib          # 如果您想显示图片
  - tqdm